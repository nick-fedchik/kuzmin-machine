name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iverilog verilator yosys python3-z3 gcc golang-go python3-pytest
      - name: Tool versions
        run: iverilog -V 2>&1 | head -1; verilator --version; yosys -V; python3 -c "import z3; print('z3', z3.get_version_string())"; gcc --version | head -1; go version; python3 --version
      - name: Go VMK format, vet and unit tests
        run: cd Engineering/sw/vmk-go && test -z "$(gofmt -l .)" && go vet ./... && go test -v ./...
      - name: Link check
        run: python3 Project/tools/check_links.py
      - name: WP structure and immutable-input hashes
        run: python3 Project/tools/check_wp_documents.py
      - name: Tests (current software, RTL and recorded evidence)
        run: python3 -m pytest -q
      - name: Current RTL simulation, lint and XC7 logic synthesis
        run: bash Engineering/hw/scripts/run_open_flow.sh
