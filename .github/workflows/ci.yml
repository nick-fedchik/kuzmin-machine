name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iverilog verilator yosys gcc python3-pytest
      - name: Tool versions
        run: iverilog -V 2>&1 | head -1; verilator --version; yosys -V; gcc --version | head -1; python3 --version
      - name: Link check
        run: python3 Project/tools/check_links.py
      - name: WP structure and immutable-input hashes
        run: python3 Project/tools/check_wp_documents.py
      - name: Tests (current software, RTL and recorded evidence)
        run: python3 -m pytest -q
      - name: Current RTL simulation, lint and XC7 logic synthesis
        run: bash Engineering/hw/scripts/run_open_flow.sh
